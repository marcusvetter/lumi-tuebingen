backend:
  name: github
  repo: marcusvetter/lumi-tuebingen
  branch: main
  base_url: https://lumi-tuebingen-cms-auth.marcus-vetter.workers.dev

media_folder: /public/media
public_folder: /media

editor:
  preview: false

singletons:
  - name: home
    label: Startseite
    file: content/home.md
    icon: home
    fields:
      - label: Meta
        name: meta
        widget: object
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: text }

      - label: Sections
        name: sections
        widget: list
        types:
          - label: Markdown
            name: markdown
            widget: object
            fields:
              - { label: Inhalt, name: content, widget: markdown }

          - label: Ankündigung
            name: announcement
            widget: object
            fields:
              - { label: Aktiviert, name: enabled, widget: boolean, default: false }
              - { label: Titel, name: title, widget: string, required: false }
              - { label: Datum, name: date, widget: string, required: false }
              - { label: Uhrzeit, name: time, widget: string, required: false }
              - { label: Beschreibungstext, name: text, widget: markdown, required: false }
              - { label: Kontakt-E-Mail, name: contact_email, widget: string, required: false }

          - label: PDF
            name: pdf
            widget: object
            fields:
              - { label: Überschrift, name: title, widget: string, required: false }
              - { label: PDF Dateiname, name: file, widget: string }
